name: YouTube Video Notifier

on:
  schedule:
    # 北京时间 20:00 到次日 07:00 每 30 分钟运行一次（UTC 时间 12:00-23:00）
    - cron: '*/30 12-23 * * *'
  workflow_dispatch:  # 保留手动触发，方便随时测试

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 升级至 v4

      - name: Set up Python
        uses: actions/setup-python@v5  # 升级至 v5
        with:
          python-version: '3.12'  # 改用当前稳定支持的 3.12 版本

      - name: Cache Video Records
        uses: actions/cache@v4  # 升级至 v4
        with:
          path: |
            latest_video_*.txt
          key: ${{ runner.os }}-video-records-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-video-records-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notifier script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python notify.py
