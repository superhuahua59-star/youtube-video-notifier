name: YouTube Video Notifier

on:
  schedule:
    # 换算成 UTC 时间是 12:00 到 23:00（即北京时间 20:00 到次日 07:00），每 30 分钟一次
    - cron: '*/30 12-23 * * *'
  workflow_dispatch:  # 允许你在网页上手动点击运行

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      # 【核心修复】：缓存视频记录文件，防止 GitHub 每次运行都遗忘，导致重复发送邮件
      - name: Cache Video Records
        uses: actions/cache@v3
        with:
          path: |
            latest_video_*.txt
          key: ${{ runner.os }}-video-records-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-video-records-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 直接安装 requirements.txt，确保不缺任何包
          pip install -r requirements.txt

      - name: Run notifier script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}  # 注意这里是 IDS
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python notify.py
