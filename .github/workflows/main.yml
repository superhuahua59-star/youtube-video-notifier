name: YouTube Video Notifier

on:
  schedule:
    # 换算成 UTC 时间是 12:00 到 23:00（即北京时间 20:00 到次日 07:00）
    # 每 30 分钟运行一次。注意：GitHub Actions 由于服务器负载，实际触发可能会有几分钟延迟。
    - cron: '*/30 12-23 * * *'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 建议直接安装 requirements.txt 里的所有依赖，防止缺少模块
          pip install -r requirements.txt

      - name: Run notifier script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}  # 这里加个S
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python notify.py
